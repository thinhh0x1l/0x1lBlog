logging.level.org.mybatis=info
logging.level.org.springframework.web=info
logging.level.org.springframework.security=info

# Datasource
spring.datasource.hikari.jdbc-url=jdbc:postgresql://localhost:5432/blog
spring.datasource.hikari.username=blog
spring.datasource.hikari.password=blog123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=redis123

# JWT
jwt.secret-key=dev-secret-key-not-for-production
jwt.access-expiration=86400000
