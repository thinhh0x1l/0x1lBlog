spring.application.name=space-api

logging.level.root=info
logging.level.top.blogapi=debug
logging.file.name=space-api/log/blog-dev

logging.level.org.mybatis=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

spring.datasource.url=jdbc:postgresql://localhost:5432/space
spring.datasource.username=space
spring.datasource.password=1820
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# MyBatis
mybatis.configuration.map-underscore-to-camel-case=true

# JWT
jwt.secret-key=${JWT_SECRET_KEY:dev-secret-key-not-for-production}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:86400000}


spring.datasource.hikari.connection-timeout=20000

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=redis123


app.frontend-url=http://localhost:5174
